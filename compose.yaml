services:
  # Live preview with auto-reload: docker compose up dev  ->  http://localhost:1313
  dev:
    build:
      context: .
      target: hugo
    ports:
      - "1313:1313"
    volumes:
      - .:/site

  # Production-like build served by nginx: docker compose up web  ->  http://localhost:8080
  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
